services:
  knowledge-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: knowledge-server:latest
    container_name: knowledge-server
    restart: unless-stopped
    ports:
      - "${PORT:-443}:443"
    environment:
      - PORT=443
      - ACTIONDOCK_TOKEN=${ACTIONDOCK_TOKEN:?ACTIONDOCK_TOKEN is required (generate using openssl rand -hex 32)}
      - ACTIONDOCK_AGENT_TOKEN=${ACTIONDOCK_AGENT_TOKEN:?ACTIONDOCK_AGENT_TOKEN is required (generate using openssl rand -hex 32)}
      - WORKSPACE_ROOT=/srv/workspace
      - KNOWLEDGE_INBOX_ROOT=/srv/knowledge-inbox
      - GIT_BLOBLESS_FETCH=true
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Knowledge Maintainer}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-maintainer@actiondock.local}
    volumes:
      - ./server/entrypoint.sh:/entrypoint.sh:ro
      # ActionDock 运行时状态库 (包含检查点 checkpoints 与运行状态，必须持久化以防容器重启丢失)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/state:/root/.actiondock
      # 代码工程工作区 (统一基于 KNOWLEDGE_DATA_DIR 自动衍生，不给单独自定义)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/workspace:/srv/workspace
      # Knowledge Inbox 待审与归档候选池
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/inbox:/srv/knowledge-inbox
      # 宿主机 SSH 密钥 (用于向 Git 代码仓免密拉取与推送)
      - ${SSH_DIR:-/root/.ssh}:/root/.ssh:ro
      # 仓库清单配置文件目录 (包含 repos.json)
      - ./server/config:/etc/actiondock
      # 可选的正式 TLS 证书目录 (cert.pem 和 key.pem)
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/certs:/etc/actiondock/certs:ro
      # 维护与系统日志目录
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/logs:/var/log/actiondock
      # 本地沙盒 Git 裸仓远端目录
      - ${KNOWLEDGE_DATA_DIR:-/data/knowledge}/remotes:/data/knowledge/remotes
    healthcheck:
      test: ["CMD-SHELL", "curl -kf -H \"Authorization: Bearer $${ACTIONDOCK_TOKEN}\" https://localhost:443/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
